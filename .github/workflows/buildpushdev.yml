name: buildpushdev
on:
  push:
    branches:
      - main
    # Docs don't go into the image, so a docs-only push shouldn't build one —
    # it would burn a runner and add an "Update Image Version" commit for a
    # change nothing ships. A push that touches docs *and* code still builds:
    # paths-ignore only skips when every changed file matches.
    #
    # Deliberately not applied to buildpushprod.yml — that one is triggered by
    # a v* tag, where the tag is the release intent and a skipped build would
    # leave values-prod.yaml pinned to the wrong image.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.planning/**'

jobs:
  build_prod:
    # The type of runner that the job will run on
    name: buildpushdev
    runs-on: [self-hosted, linux]
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short SHA
        id: slug
        run: echo "BUILD_TAG=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: dimozone/fleet-onboard-app:${{ steps.slug.outputs.BUILD_TAG }}, dimozone/fleet-onboard-app:latest
# note we are going straight to prod here. There is no dev env possible due to LIWD
      - name: Update Image Version in the related HelmChart values.yaml
        uses: fjogeleit/yaml-update-action@v0.15.0
        with:
          valueFile: 'charts/fleet-onboard-app/values.yaml'
          propertyPath: 'image.tag'
          value: ${{ steps.slug.outputs.BUILD_TAG }}
          branch: main
          message: 'Update Image Version to ${{ steps.slug.outputs.BUILD_TAG }}'